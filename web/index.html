<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sagelift">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sagelift</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Version the executable assets as well as the document. A query on this
    // page alone does not invalidate a cached bootstrap or main.dart.js.
    (async () => {
      let buildId = new URL(location.href).searchParams.get('sagelift-build');
      try {
        const versionUrl = new URL('version.json', document.baseURI);
        versionUrl.searchParams.set('cacheBust', Date.now());
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        let response;
        try {
          response = await fetch(versionUrl, { cache: 'no-store', signal: controller.signal });
        } finally {
          clearTimeout(timeout);
        }
        if (!response.ok) throw new Error('Version unavailable');
        const version = await response.json();
        if (typeof version.buildId === 'string' && version.buildId.length > 0 && version.buildId !== 'development') {
          buildId = version.buildId;
        }
      } catch (_) {
        // Keep the installed app usable when offline. This key contains only
        // the last successfully loaded release ID, never workout data.
        try {
          buildId ||= localStorage.getItem('sagelift.loaded-build.v1');
        } catch (_) {}
      }
      const bootstrap = new URL('flutter_bootstrap.js', document.baseURI);
      if (buildId) bootstrap.searchParams.set('sagelift-build', buildId);
      const script = document.createElement('script');
      script.src = bootstrap.href;
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
